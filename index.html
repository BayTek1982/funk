const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=(v,d=0)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const uniq=(right,cands)=>{const o=[right];for(const c of cands){if(o.length>=4)break;if(!o.includes(c))o.push(c);}let k=2;while(o.length<4){const v=right+' ('+(k++)+')';if(!o.includes(v))o.push(v);}return o;};
const lam=m=>m>=1?fmt(m,m%1?1:0)+' m':fmt(m*100,(m*100)%1?1:0)+' cm';
function calcQ(){
 const k=rnd(6);
 if(k===0){const f=[[100,3],[150,2],[300,1],[600,.5],[750,.4],[1500,.2],[2400,.125],[3000,.1],[5000,.06]][rnd(9)],r=f[1];
  return{q:`Rechenaufgabe: Wie groß ist die Wellenlänge bei ${fmt(f[0])} MHz? (Faustformel: λ in m = 300 ÷ f in MHz)`,opts:uniq(lam(r),[lam(r*10),lam(r/10),lam(r*2),lam(r/2)]),l:'frequenz',exp:`300 ÷ ${fmt(f[0])} = ${lam(r)}.`};}
 if(k===1){const gb=[1,2,4,5,8][rnd(5)],sp=[50,100,200,250,400][rnd(5)],s=gb*8000/sp;
  const t=x=>x>=120?fmt(x/60,x%60?1:0)+' Minuten':fmt(x,x%1?1:0)+' Sekunden';
  return{q:`Rechenaufgabe: Wie lange dauert der Download einer ${gb}-GB-Datei bei ${sp} Mbit/s (ohne Pausen)?`,opts:uniq(t(s),[t(s*8),t(s/8),t(s*2),t(s/2)]),l:'daten',exp:`${fmt(gb*1000)} MB × 8 = ${fmt(gb*8000)} Mbit. ${fmt(gb*8000)} ÷ ${sp} = ${fmt(s,s%1?1:0)} Sekunden.`};}
 if(k===2){const d=[[3,'die Hälfte'],[6,'ein Viertel'],[10,'ein Zehntel'],[20,'ein Hundertstel']][rnd(4)];
  return{q:`Rechenaufgabe: Das Signal wird um ${d[0]} dB schwächer. Wie viel Leistung bleibt übrig?`,opts:uniq(d[1],['die Hälfte','ein Viertel','ein Zehntel','ein Hundertstel','ein Drittel']),l:'empfang',exp:'Merke: −3 dB = ½, −6 dB = ¼, −10 dB = 1/10, −20 dB = 1/100.'};}
 if(k===3){const m=[2,3,4,5][rnd(4)],r=m*m;
  return{q:`Rechenaufgabe: Du bist ${m}-mal so weit vom Sender entfernt (freier Raum). Welcher Teil der Leistung kommt noch an?`,opts:uniq('1/'+r,['1/'+m,'1/'+(m*2),'1/'+(r*2),'1/'+(r+1)]),l:'ausbreitung',exp:`Die Leistung sinkt mit dem Quadrat der Entfernung: ${m} × ${m} = ${r} → 1/${r}.`};}
 if(k===4){const sp=[16,40,80,100,200,400,800][rnd(7)],r=sp/8;
  return{q:`Rechenaufgabe: Dein Anschluss hat ${sp} Mbit/s. Wie viele Megabyte pro Sekunde sind das?`,opts:uniq(fmt(r,r%1?1:0)+' MB/s',[fmt(sp*8)+' MB/s',fmt(sp)+' MB/s',fmt(r*2,r%1?1:0)+' MB/s',fmt(r/2,(r/2)%1?1:0)+' MB/s']),l:'daten',exp:`${sp} ÷ 8 = ${fmt(r,r%1?1:0)} MB/s, weil 1 Byte = 8 Bit.`};}
 const h=[1,2,3,4][rnd(4)],per=[1.5,2,3][rnd(3)],v=h*per;
 return{q:`Rechenaufgabe: Du schaust ${h} Stunde${h>1?'n':''} HD-Video unterwegs. Es braucht etwa ${fmt(per,per%1?1:0)} GB pro Stunde. Wie viel Datenvolumen ist das?`,opts:uniq(fmt(v,v%1?1:0)+' GB',[fmt(v*2,(v*2)%1?1:0)+' GB',fmt(v/2,(v/2)%1?1:0)+' GB',fmt(v+1,(v+1)%1?1:0)+' GB',fmt(per,per%1?1:0)+' GB']),l:'daten',exp:`${h} × ${fmt(per,per%1?1:0)} GB = ${fmt(v,v%1?1:0)} GB.`};
}
function picQ(ex){const pool=L.filter(x=>!ex.includes(x.id)),l=pool[rnd(pool.length)],others=shuf(L.filter(x=>x!==l)).slice(0,3);ex.push(l.id);
 return{pic:l,q:'Bilderfrage: Zu welcher Lektion gehört dieses Bild?',opts:[l.t,...others.map(o=>o.t)],l:l.id,exp:`Das Bild stammt aus der Lektion „${l.t}“.`};}
let QZ=null;
function newQuiz(){
 const ks=shuf(KQ).slice(0,5).map(k=>({q:k[0],opts:k[1],l:k[2],exp:k[3]})),ex=[];
 const qs=shuf([...ks,picQ(ex),picQ(ex),calcQ(),calcQ(),calcQ()]);
 qs.forEach(x=>{const right=x.opts[0];x.sh=shuf(x.opts);x.ok=x.sh.indexOf(right);});
 QZ={qs,i:0,pts:0,wrong:[]};
}
function vQuiz(){
 if(!QZ){M.innerHTML=`<a class="back" href="#home">← Startseite</a><div class="qcard" style="text-align:center"><div style="font-size:52px">🎯</div><h1 class="ltitle" style="margin-top:6px">Funk-Quiz</h1><p style="color:var(--mut)">10 zufällige Fragen – Bilderfragen, Wissensfragen und Rechenaufgaben.</p><div class="score" style="font-size:20px">BESTWERT ${ST.best}/10</div><button class="big" id="go">QUIZ STARTEN</button></div>`;
  document.getElementById('go').onclick=()=>{newQuiz();vQuiz();};return;}
 if(QZ.i>=QZ.qs.length){
  const nb=QZ.pts>ST.best;if(nb){ST.best=QZ.pts;}ST.runs++;save();renderSide();
  const rep=[...new Set(QZ.wrong)];
  M.innerHTML=`<a class="back" href="#home">← Startseite</a><div class="qcard"><div class="qtop"><span>ERGEBNIS</span><span>BESTWERT ${ST.best}/10</span></div><div class="score" style="color:${QZ.pts>=8?'var(--green)':QZ.pts>=5?'var(--gold)':'var(--red)'}">${QZ.pts}/10</div><p style="text-align:center;color:var(--mut)">${nb?'🏆 Neuer Bestwert!':QZ.pts>=8?'Stark – du kennst dich aus!':QZ.pts>=5?'Gut! Mit etwas Wiederholung schaffst du mehr.':'Schau dir die Lektionen noch einmal an.'}</p>
  ${rep.length?`<div class="rep" style="margin-top:14px"><div class="meta" style="color:var(--mut)">ZUM WIEDERHOLEN</div>${rep.map(id=>`<a href="#l-${id}">▶ ${byId[id].t} <span style="color:var(--mut);font-size:12px">· ${areaOf(byId[id].a).name}</span></a>`).join('')}</div>`:''}
  <button class="big" id="again">NOCH EINMAL</button></div>`;
  document.getElementById('again').onclick=()=>{newQuiz();vQuiz();};QZ=null;return;}
 const x=QZ.qs[QZ.i];
 M.innerHTML=`<a class="back" href="#home">← Startseite</a><div class="qcard"><div class="qtop"><span>FRAGE ${QZ.i+1} / 10</span><span>PUNKTE ${QZ.pts}</span></div><div class="qbar"><i style="width:${QZ.i*10}%"></i></div>
 ${x.pic?'<div class="qimg"><canvas id="qcv"></canvas></div>':''}<div class="qq">${x.q}</div><div class="opts">${x.sh.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
 if(x.pic){const cv=document.getElementById('qcv'),les=x.pic;const d=()=>paint(cv,les,les.steps.length-1,1);redrawHooks=[d];requestAnimationFrame(d);}
 M.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,ok=i===x.ok;
  M.querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j===x.ok)o.classList.add('ok');else if(j===i)o.classList.add('no');});
  if(ok)QZ.pts++;else QZ.wrong.push(x.l);
  document.getElementById('fb').innerHTML=`<div class="fb"><b style="color:${ok?'var(--green)':'var(--red)'}">${ok?'✓ RICHTIG!':'✗ LEIDER FALSCH'}</b><div style="margin-top:4px">${x.exp}</div><a class="go" href="#l-${x.l}">→ Zur Lektion „${byId[x.l].t}“</a></div><button class="big" id="nx">${QZ.i<9?'NÄCHSTE FRAGE →':'ERGEBNIS ANZEIGEN'}</button>`;
  document.getElementById('nx').onclick=()=>{QZ.i++;vQuiz();window.scrollTo(0,0);};
 });
}

/* ============ Router ============ */
function route(){
 stopPlayer();redrawHooks=[];
 const h=location.hash.replace(/^#/,'')||'home',m=h.match(/^(b|l)-([\w-]+)$/),p=m?[m[1],m[2]]:[h];
 if(p[0]!=='quiz')QZ=null;
 if(p[0]==='b')vArea(p[1]);else if(p[0]==='l')vLesson(p[1]);else if(p[0]==='quiz')vQuiz();else vHome();
 renderSide();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
readPal();applyTheme();route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
